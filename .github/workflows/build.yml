name: Build

# The repository is private, so Actions minutes are limited (Windows runners count double).
# Pull requests run the tests and the Android build once; installers and the Store package are
# built on main (and when run by hand). Documentation-only changes don't build at all.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md", "packaging/store/**"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md", "packaging/store/**"]
  workflow_dispatch:

# A newer push to the same branch or pull request cancels the run that is still going.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test
        run: dotnet test Beam.sln -c Release --logger "trx;LogFileName=results.trx"
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots-${{ matrix.os }}
          path: artifacts/screenshots
          if-no-files-found: ignore

  package:
    name: Package (${{ matrix.runtime }})
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    strategy:
      matrix:
        runtime: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish and build installer
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          ./build.ps1 -Runtime ${{ matrix.runtime }} -SkipTests -Installer
      - uses: actions/upload-artifact@v4
        with:
          # Named after the exact commit it was built from (run the workflow by hand to package any branch).
          name: beam-${{ matrix.runtime }}-${{ github.sha }}
          path: |
            artifacts/publish/${{ matrix.runtime }}/Beam.exe
            artifacts/installer/*.exe

  store-package:
    name: Store package (MSIX)
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build MSIX bundle (validates the manifest and builds the context-menu handler)
        shell: pwsh
        run: ./packaging/build-msix.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: beam-msix-${{ github.sha }}
          path: artifacts/msix/*.msixbundle

  ios:
    name: iOS app (unsigned IPA)
    needs: test
    # macOS minutes count ten times: only when run by hand or on main.
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Use the newest complete Xcode
        run: |
          # Take the newest real Xcode folder that has both SDKs. Some names are symlinks to another Xcode
          # (Xcode_26.6.0.app -> Xcode_26.6.app): xcodebuild can't find its SDKs through such a path.
          for xcode in $(ls -d /Applications/Xcode_*.app | sort -rV); do
            [ -L "$xcode" ] && continue
            xcode=$(cd "$xcode" && pwd -P)
            if [ -d "$xcode/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS.sdk" ] \
               && [ -d "$xcode/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk" ]; then
              sudo xcode-select -s "$xcode"
              break
            fi
          done
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun -f clang
      - name: Install the .NET iOS workload
        run: dotnet workload install ios
      - name: Build the app (not signed)
        run: |
          dotnet publish src/Beam.iOS -c Release -f net10.0-ios26.0 -r ios-arm64 \
            -p:EnableCodeSigning=false -p:ValidateXcodeVersion=false
          app=$(find src/Beam.iOS/bin -name "*.app" -type d -path "*ios-arm64*" | head -1)
          echo "App bundle: $app"
          mkdir -p artifacts/ios/Payload
          cp -R "$app" artifacts/ios/Payload/
          (cd artifacts/ios && zip -qry Beam-ios-unsigned.ipa Payload)
          ls -la artifacts/ios
      - uses: actions/upload-artifact@v4
        with:
          # Unsigned: sign it while installing (e.g. Sideloadly with an Apple ID) or with a developer certificate.
          name: beam-ios-unsigned-${{ github.sha }}
          path: artifacts/ios/Beam-ios-unsigned.ipa

  android:
    name: Android app (APK)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write   # publishes the "Android test build" release on main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          # Android apps target the current .NET (net10.0-android); the shared libraries stay on .NET 8.
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install the .NET Android workload
        run: dotnet workload install android
      - name: Build APK
        run: |
          dotnet publish src/Beam.Android -c Release -f net10.0-android \
            -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT" -o artifacts/android
          ls -la artifacts/android
      - uses: actions/upload-artifact@v4
        with:
          name: beam-android-${{ github.sha }}
          path: artifacts/android/*-Signed.apk
      # Testers download the newest APK from the Releases page ("Android test build"), not from Actions artifacts.
      - name: Publish Android test build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cp artifacts/android/*-Signed.apk artifacts/android/Beam-android-test.apk
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          tag_name: android-test
          name: Android test build
          prerelease: true
          make_latest: false
          body: |
            Newest Beam for Android test build (commit ${{ env.SHORT_SHA }}). Updated automatically on every change.
            Install: download **Beam-android-test.apk** on the phone, open it and allow installing from this source.
          files: artifacts/android/Beam-android-test.apk
