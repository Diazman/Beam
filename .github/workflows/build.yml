name: Build

on:
  push:
    branches: [main, master, "claude/**"]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test
        run: dotnet test Beam.sln -c Release --logger "trx;LogFileName=results.trx"
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots-${{ matrix.os }}
          path: artifacts/screenshots
          if-no-files-found: ignore

  package:
    name: Package (${{ matrix.runtime }})
    needs: test
    runs-on: windows-latest
    strategy:
      matrix:
        runtime: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish and build installer
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          ./build.ps1 -Runtime ${{ matrix.runtime }} -SkipTests -Installer
      - uses: actions/upload-artifact@v4
        with:
          name: beam-${{ matrix.runtime }}
          path: |
            artifacts/publish/${{ matrix.runtime }}/Beam.exe
            artifacts/installer/*.exe

  store-package:
    name: Store package (MSIX)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build MSIX bundle (validates the manifest and builds the context-menu handler)
        shell: pwsh
        run: ./packaging/build-msix.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: beam-msix
          path: artifacts/msix/*.msixbundle

  android:
    name: Android app (APK)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          # Android apps target the current .NET (net10.0-android); the shared libraries stay on .NET 8.
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install the .NET Android workload
        run: dotnet workload install android
      - name: Build APK
        run: |
          dotnet publish src/Beam.Android -c Release -f net10.0-android \
            -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT" -o artifacts/android
          ls -la artifacts/android
      - uses: actions/upload-artifact@v4
        with:
          name: beam-android
          path: artifacts/android/*-Signed.apk
